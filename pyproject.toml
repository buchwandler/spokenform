[build-system]
requires = ["setuptools>=80", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "spokenform"
dynamic = ["version"]
description = "Single-language written-to-spoken text normalization for speech applications"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com" },
]
keywords = [
  "normalization",
  "nlp",
  "speech",
  "text-to-speech",
  "tts",
  "verbalization",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  # 0.2.11 owns the public source-aligned replacement contract.
  "abbr2words>=0.2.11,<0.3.0",
  "cn2an>=0.5.24,<0.6",
  "num2words>=0.5.14,<0.6",
]

[project.optional-dependencies]
lexhint = ["lexhint>=0.1.2,<0.3.0"]
spacy = ["spacy>=3.7,<4"]
dev = [
  "build>=1",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "tomli>=2.0.1; python_version < '3.11'",
  "twine>=5",
]
all = ["spacy>=3.7,<4", "lexhint>=0.1.2,<0.3.0"]

[project.scripts]
spokenform = "spokenform.cli:main"

[project.urls]
Homepage = "https://github.com/buchwandler/spokenform"
Repository = "https://github.com/buchwandler/spokenform"
Issues = "https://github.com/buchwandler/spokenform/issues"
Changelog = "https://github.com/buchwandler/spokenform/blob/main/docs/changelog.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["spokenform*"]

[tool.setuptools.package-data]
spokenform = ["py.typed"]

[tool.setuptools_scm]
version_file = "spokenform/_version.py"
fallback_version = "0+unknown"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
source = ["spokenform"]
branch = true
omit = ["spokenform/_version.py"]

[tool.coverage.report]
# Keep the branch-aware gate just below the current baseline while the recent
# sequence and number recognizer expansion receives dedicated coverage.
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
packages = ["spokenform"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
