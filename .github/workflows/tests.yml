name: Run tests

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Run tests
        run: python -X faulthandler -m pytest

      - name: Run quality checks
        if: runner.os == 'Linux' && matrix.python-version == '3.10'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy spokenform examples
          python -m twine check dist/*


  spacy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install spaCy test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,spacy]"

      - name: Run real spaCy integration tests
        run: python -m pytest tests/test_spacy_integration.py
