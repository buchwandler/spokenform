name: Run tests
on:
  push:
  pull_request:
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install packages
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Build distributions
      run: python -m build
    - name: Run tests
      if: runner.os != 'Windows'
      run: python -m pytest
    - name: Run tests on Windows
      if: runner.os == 'Windows'
      timeout-minutes: 60
      env:
        PYTHONFAULTHANDLER: "1"
      run: python -X faulthandler -m pytest -vv
    - name: Run quality checks
      if: runner.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        python -m ruff check .
        python -m ruff format --check .
        python -m mypy spokenform examples
    - name: Run release coverage gate
      if: runner.os == 'ubuntu-latest' && matrix.python-version == '3.10'
      run: |
        python -m pytest \
          --cov=spokenform \
          --cov-branch \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=85
  cjk-contract:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Spokenform and CJK dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
    - name: Assert released CJK dependency contract
      run: python -m pytest -q tests/test_packaging.py -k released_abbr2words_0211_contract
    - name: Run focused CJK contract
      run: >
        python -m pytest -q
        tests/test_language.py
        tests/test_number_words.py
        tests/test_ja.py
        tests/test_ko.py
        tests/test_zh_cn.py
        tests/test_cjk_no_english_fallback.py
        tests/test_cjk_fullwidth_numbers.py
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install exact abbr2words floor
      run: |
        python -m pip install --upgrade pip
        python -m pip install "abbr2words==0.2.11" "pytest>=8"
        python -m pip install -e . --no-deps
    - name: Run minimum dependency contract
      run: >
        python -m pytest -q
        tests/test_abbreviations.py
        tests/test_dependency_contract.py

  lexhint-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.12"
            lexhint-requirement: "lexhint==0.1.2"
          - python-version: "3.12"
            lexhint-requirement: "lexhint>=0.2.0,<0.3.0"
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Spokenform and Lexhint contract target
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip install "${{ matrix.lexhint-requirement }}"
    - name: Assert Lexhint is installed
      run: |
        python -c "import lexhint; print(lexhint.__version__)"
    - name: Run real Lexhint provider contract
      run: |
        python -m pytest -q tests/test_evidence.py -k real_lexhint_runtime_contract
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install documentation dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"
        python -m pip install -r docs/requirements.txt
    - name: Build documentation with warnings as errors
      run: sphinx-build -W -b html docs docs/_build/html
  candidate-downstream:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install candidate and downstream stack
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e "."
        python -m pip install "kokorog2p[de,fr]" pytest
    - name: Assert candidate spokenform import
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import spokenform

        expected = Path(os.environ["GITHUB_WORKSPACE"]) / "spokenform" / "__init__.py"
        actual = Path(spokenform.__file__).resolve()
        assert actual == expected.resolve(), (actual, expected)
        print(actual)
        PY
    - name: Run real kokorog2p compatibility gate
      run: python -m pytest -q tests/test_real_kokorog2p_integration.py
  released-downstream:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install released downstream stack
      run: |
        python -m pip install --upgrade pip
        python -m pip install "spokenform" "kokorog2p[de,fr]" pytest
    - name: Assert released spokenform import
      env:
        GITHUB_WORKSPACE: ${{ github.workspace }}
      working-directory: /tmp
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import spokenform

        checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        actual = Path(spokenform.__file__).resolve()
        assert checkout not in actual.parents, (actual, checkout)
        print(actual)
        PY
    - name: Run released kokorog2p compatibility gate
      working-directory: /tmp
      run: python -m pytest -q "$GITHUB_WORKSPACE/tests/test_real_kokorog2p_integration.py"
