# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
    - name: Build and validate distributions
      run: |
        python -m build
        python -m twine check dist/*
    - name: Smoke test wheel in a clean environment
      run: |
        python -m venv .release-smoke
        .release-smoke/bin/python -m pip install --upgrade pip
        .release-smoke/bin/python -m pip install dist/*.whl
        .release-smoke/bin/python -c "import spokenform; result = spokenform.prepare('2 items', language='en', use_spacy=False); assert result.spoken_text == 'two items'; print(spokenform.__version__)"
        .release-smoke/bin/spokenform --help
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@v1.13.0
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
