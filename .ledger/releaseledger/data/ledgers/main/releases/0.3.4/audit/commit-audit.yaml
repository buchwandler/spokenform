      Adds public abbreviation-registry controls and explicit KokoroG2P
      profile and language-resolution APIs; adds conservative Arabic, Hebrew, and Kazakh
      profiles; adds Korean native counter morphology; and moves Thai time, decimal,
      range, identifier, laughter, repetition, operator, and currency handling into
      source-aligned structured replacements. New and updated tests cover aliases, profile
      policies, protected spans, counters, and Thai semantics.
